name: 每日台股自動選股排程

on:
  schedule:
    - cron: '30 8 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-screener:
    runs-on: ubuntu-latest
    steps:
      - name: 下載倉庫程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 執行台股技術與籌碼篩選腳本
        run: python update_stocks.py

      - name: 自動儲存最新推薦名單
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add recommendations.json
          git commit -m "更新每日台股推薦名單" || exit 0
          git push
