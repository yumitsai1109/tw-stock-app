name: DailyStockScreener
on:
  schedule:
    - cron: '30 8 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run-screener:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python update_stocks.py
      - run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add recommendations.json
          git commit -m "Update daily picks" || exit 0
          git push
