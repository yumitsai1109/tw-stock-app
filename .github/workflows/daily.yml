name: DailyStockScreener
on:
  schedule:
    - cron: '30 7 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-screener:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 執行台股技術與籌碼篩選
        run: |
          cat << 'EOF' > run_screener.py
          import urllib.request
          import ssl
          import json
          import math
          import time
          from datetime import datetime, timedelta, timezone

          ctx = ssl.create_default_context()
          ctx.check_hostname = False
          ctx.verify_mode = ssl.CERT_NONE

          tw_tz = timezone(timedelta(hours=8))
          now_tw = datetime.now(tw_tz)

          def fetch_text(url, timeout=15):
              req = urllib.request.Request(url, headers={
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0.0.0 Safari/537.36",
                  "Accept": "application/json,text/plain,*/*",
                  "Referer": "https://finance.yahoo.com/"
              })
              with urllib.request.urlopen(req, context=ctx, timeout=timeout) as resp:
                  return resp.read().decode("utf-8", errors="ignore")

          def safe_float(val, default=0.0):
              try:
                  if val is None:
                      return default
                  s = str(val).replace(",", "").strip()
                  return float(s) if s and s not in ("--", "N/A", "null", "None", "nan") else default
              except Exception:
                  return default

          def fetch_yahoo_v8_bars(code):
              for host in ("query1.finance.yahoo.com", "query2.finance.yahoo.com"):
                  url = f"https://{host}/v8/finance/chart/{code}.TW?range=3mo&interval=1d"
                  try:
                      data = json.loads(fetch_text(url, timeout=12))
                      result = data.get("chart", {}).get("result", [])
                      if not result:
                          continue
                      res0 = result[0]
                      timestamps = res0.get("timestamp", [])
                      quote = res0.get("indicators", {}).get("quote", [{}])[0]
                      opens = quote.get("open", [])
                      lows = quote.get("low", [])
                      closes = quote.get("close", [])
                      volumes = quote.get("volume", [])
                      bars = []
                      for i in range(min(len(timestamps), len(closes))):
                          c_val = safe_float(closes[i])
                          o_val = safe_float(opens[i], c_val)
                          l_val = safe_float(lows[i], c_val)
                          v_lots = int(safe_float(volumes[i])) // 1000
                          if c_val > 0 and o_val > 0:
                              d_str = datetime.fromtimestamp(timestamps[i], tz=tw_tz).strftime("%Y-%m-%d")
                              bars.append((d_str, o_val, c_val, l_val, v_lots))
                      if len(bars) >= 21:
                          return bars
                  except Exception:
                      continue
              return []

          watch_list = [
              ("2330","台積電"),("2317","鴻海"),("2454","聯發科"),("2382","廣達"),("3231","緯創"),
              ("2308","台達電"),("2303","聯電"),("3711","日月光投控"),("2357","華碩"),("2376","技嘉"),
              ("3017","奇鋐"),("3324","雙鴻"),("2368","金像電"),("3037","欣興"),("2383","台光電"),
              ("2603","長榮"),("2609","陽明"),("2615","萬海"),("2618","長榮航"),("2610","華航"),
              ("1513","中興電"),("1519","華城"),("1503","士電"),("1504","東元"),("1609","大亞"),
              ("2881","富邦金"),("2882","國泰金"),("2891","中信金"),("2886","兆豐金"),("2884","玉山金"),
              ("2327","國巨"),("2492","華新科"),("3008","大立光"),("3443","創意"),("3661","世芯-KY"),
              ("6669","緯穎"),("2356","英業達"),("2324","仁寶"),("4938","和碩"),("2301","光寶科"),
              ("2345","智邦"),("3533","嘉澤"),("2049","上銀"),("1590","亞德客-KY"),("2395","研華"),
              ("2408","南亞科"),("2344","華邦電"),("3034","聯詠"),("2379","瑞昱"),("5347","世界"),
              ("2466","冠西電"),("8112","至上"),("2409","友達"),("3481","群創"),("6770","力積電"),
              ("3035","智原"),("3529","力旺"),("5269","祥碩"),("6415","矽力*-KY"),("2360","致茂")
          ]

          all_analyzed = []
          zhu_lin_picks = []
          sarah_picks = []
          market_date = now_tw.strftime("%Y-%m-%d")
          ok_count = 0

          for code, name in watch_list:
              bars = fetch_yahoo_v8_bars(code)
              if len(bars) < 21:
                  continue
              ok_count += 1
              market_date = bars[-1][0]
              opens = [b[1] for b in bars]
              closes = [b[2] for b in bars]
              lows = [b[3] for b in bars]
              vols = [b[4] for b in bars]

              curr_c, curr_o, prev_c, curr_v = closes[-1], opens[-1], closes[-2], vols[-1]
              if curr_v < 500 or prev_c <= 0:
                  continue

              pct = round(((curr_c - prev_c) / prev_c) * 100, 2)
              ma5 = sum(closes[-5:]) / 5.0
              ma10 = sum(closes[-10:]) / 10.0
              ma20 = sum(closes[-20:]) / 20.0
              prev_ma5 = sum(closes[-6:-1]) / 5.0
              prev_ma20 = sum(closes[-21:-1]) / 20.0
              vol_ma5 = sum(vols[-6:-1]) / 5.0
              vol_ratio = round(curr_v / vol_ma5, 1) if vol_ma5 > 0 else 1.0
              std20 = math.sqrt(sum((p - ma20) ** 2 for p in closes[-20:]) / 20.0)
              bb_upper = ma20 + 2.0 * std20

              chip_tags = []
              if vol_ratio >= 1.5:
                  chip_tags.append(f"主力爆量{vol_ratio}倍")
              elif vol_ratio >= 1.1:
                  chip_tags.append(f"量增攻擊{vol_ratio}倍")

              base_item = {
                  "code": code, "name": name, "close": round(curr_c, 2),
                  "pct": pct, "vol": curr_v, "ma5": round(ma5, 2), "ma20": round(ma20, 2),
                  "tags": list(chip_tags)
              }
              all_analyzed.append((base_item, curr_c, curr_o, prev_c, ma5, ma10, ma20, prev_ma5, prev_ma20, bb_upper, lows))

              # 條件 1：嚴格站穩月線 20MA 多頭
              if curr_c >= ma20 and (curr_c >= ma5 or curr_c >= curr_o):
                  z_tags = list(chip_tags) + ["站穩月線多頭"]
                  if curr_c > ma10 and prev_c <= ma10:
                      z_tags.append("一陽穿三線")
                  if min(lows[-5:]) >= min(lows[-15:-5]):
                      z_tags.append("底底高結構")
                  item_z = dict(base_item)
                  item_z["tags"] = z_tags
                  zhu_lin_picks.append(item_z)

              if ma5 >= ma20 and curr_c >= ma20:
                  s_tags = list(chip_tags) + ["5MA/20MA金包銀"]
                  if prev_ma5 <= prev_ma20:
                      s_tags.append("剛黃金交叉")
                  if curr_c >= bb_upper * 0.95:
                      s_tags.append("沿2倍布林上軌強攻")
                  item_s = dict(base_item)
                  item_s["tags"] = s_tags
                  sarah_picks.append(item_s)
              time.sleep(0.08)

          # 若大盤拉回導致嚴格站上月線不足 5 檔，自動補入「站穩5MA短多 / 盤勢抗跌強勢股」
          if len(zhu_lin_picks) < 5 and all_analyzed:
              existing_z = {x["code"] for x in zhu_lin_picks}
              sorted_by_pct = sorted(all_analyzed, key=lambda t: t[0]["pct"], reverse=True)
              for base_item, curr_c, curr_o, prev_c, ma5, ma10, ma20, prev_ma5, prev_ma20, bb_upper, lows in sorted_by_pct:
                  if base_item["code"] in existing_z:
                      continue
                  item_z = dict(base_item)
                  extra_tags = list(item_z["tags"])
                  if curr_c >= ma5:
                      extra_tags.append("站上5MA短多反彈")
                  if curr_c >= curr_o:
                      extra_tags.append("逆勢收紅K抗跌")
                  else:
                      extra_tags.append("大盤修正相對抗跌")
                  item_z["tags"] = extra_tags
                  zhu_lin_picks.append(item_z)
                  if len(zhu_lin_picks) >= 10:
                      break

          if len(sarah_picks) < 5 and all_analyzed:
              existing_s = {x["code"] for x in sarah_picks}
              sorted_by_pct = sorted(all_analyzed, key=lambda t: t[0]["pct"], reverse=True)
              for base_item, curr_c, curr_o, prev_c, ma5, ma10, ma20, prev_ma5, prev_ma20, bb_upper, lows in sorted_by_pct:
                  if base_item["code"] in existing_s:
                      continue
                  item_s = dict(base_item)
                  extra_tags = list(item_s["tags"])
                  if ma5 >= ma20:
                      extra_tags.append("5MA仍在20MA之上")
                  elif curr_c >= ma5:
                      extra_tags.append("站回5MA生命線")
                  else:
                      extra_tags.append("回測均線觀察支撐")
                  item_s["tags"] = extra_tags
                  sarah_picks.append(item_s)
                  if len(sarah_picks) >= 10:
                      break

          zhu_lin_picks.sort(key=lambda x: x["pct"], reverse=True)
          sarah_picks.sort(key=lambda x: x["pct"], reverse=True)

          output = {
              "updated_at": f"{market_date} (已精算 {ok_count} 檔上市普通股 · 更新 {now_tw.strftime('%H:%M')})",
              "zhu_lin_picks": zhu_lin_picks[:12],
              "sarah_picks": sarah_picks[:12]
          }
          with open("recommendations.json", "w", encoding="utf-8") as f:
              json.dump(output, f, ensure_ascii=False, indent=2)
          print("Done:", output["updated_at"])
          EOF
          python run_screener.py
      - name: 儲存推薦名單
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add recommendations.json
          git commit -m "Update daily picks" || exit 0
          git push
