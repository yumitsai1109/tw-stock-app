name: DailyStockScreener
on:
  schedule:
    - cron: '30 7 * * 1-5' # 台灣時間週一至週五 15:30 盤後自動執行 (UTC 07:30)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-screener:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安裝網路請求套件
        run: pip install requests
      - name: 執行全市場台股技術與籌碼篩選
        run: |
          cat << 'EOF' > run_now.py
          import requests
          import json
          import math
          from collections import defaultdict
          from datetime import datetime, timedelta, timezone

          tw_tz = timezone(timedelta(hours=8))
          now_tw = datetime.now(tw_tz)
          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/128.0.0.0 Safari/537.36",
              "Accept": "application/json"
          }

          # 1. 取得全市場上市股票中文名稱對照表
          info_res = requests.get("https://api.finmindtrade.com/api/v4/data?dataset=TaiwanStockInfo", headers=headers, timeout=25).json()
          name_map = {}
          for row in info_res.get("data", []):
              code = str(row.get("stock_id", "")).strip()
              if row.get("type") == "twse" and len(code) == 4 and code.isdigit() and not code.startswith("00"):
                  name_map[code] = str(row.get("stock_name", code)).strip()

          # 2. 一次批次抓取最近 45 天全市場真實日線 (無需逐檔呼叫，完全不會被限流)
          start_date = (now_tw - timedelta(days=45)).strftime("%Y-%m-%d")
          price_res = requests.get(
              f"https://api.finmindtrade.com/api/v4/data?dataset=TaiwanStockPrice&start_date={start_date}",
              headers=headers, timeout=45
          ).json()

          grouped = defaultdict(list)
          for row in price_res.get("data", []):
              code = str(row.get("stock_id", "")).strip()
              if code in name_map:
                  grouped[code].append(row)

          zhu_lin_picks = []
          sarah_picks = []
          market_date = now_tw.strftime("%Y-%m-%d")
          scanned_count = 0

          for code, rows in grouped.items():
              rows.sort(key=lambda x: x["date"])
              if len(rows) < 21:
                  continue
              scanned_count += 1
              market_date = rows[-1]["date"]

              opens = [float(r["open"]) for r in rows]
              closes = [float(r["close"]) for r in rows]
              lows = [float(r["min"]) for r in rows]
              vols = [int(r["Trading_Volume"]) // 1000 for r in rows]

              curr_c = closes[-1]
              curr_o = opens[-1]
              prev_c = closes[-2]
              curr_v = vols[-1]

              # 基礎流動性與實體收紅濾網 (成交量 > 2,000 張且當日收紅)
              if curr_v < 2000 or curr_c <= curr_o or prev_c <= 0:
                  continue

              pct = round(((curr_c - prev_c) / prev_c) * 100, 2)
              ma5 = sum(closes[-5:]) / 5
              ma10 = sum(closes[-10:]) / 10
              ma20 = sum(closes[-20:]) / 20
              prev_ma5 = sum(closes[-6:-1]) / 5
              prev_ma20 = sum(closes[-21:-1]) / 20
              vol_ma5 = sum(vols[-6:-1]) / 5
              vol_ratio = round(curr_v / vol_ma5, 1) if vol_ma5 > 0 else 1.0

              variance = sum((p - ma20) ** 2 for p in closes[-20:]) / 20
              std20 = math.sqrt(variance)
              bb_upper = ma20 + 2 * std20

              chip_tags = []
              if vol_ratio >= 1.5:
                  chip_tags.append(f"主力爆量{vol_ratio}倍")
              elif vol_ratio >= 1.1:
                  chip_tags.append(f"量增攻擊{vol_ratio}倍")

              # 朱家泓・林穎戰法：站穩 5/10/20MA + 底底高
              if curr_c >= ma5 and curr_c >= ma20:
                  z_tags = list(chip_tags) + ["站穩月線多頭"]
                  if curr_c > ma10 and prev_c <= ma10:
                      z_tags.append("一陽穿三線")
                  if min(lows[-5:]) >= min(lows[-15:-5]):
                      z_tags.append("底底高結構")
                  zhu_lin_picks.append({
                      "code": code, "name": name_map[code], "close": round(curr_c, 2),
                      "pct": pct, "vol": curr_v, "ma5": round(ma5, 2), "ma20": round(ma20, 2),
                      "tags": z_tags
                  })

              # 莎拉形態學：5MA/20MA 多頭排列 + 沿 2倍布林上軌強攻
              if ma5 >= ma20 and curr_c >= ma20:
                  s_tags = list(chip_tags) + ["5MA/20MA多頭排列"]
                  if prev_ma5 <= prev_ma20:
                      s_tags.append("剛黃金交叉")
                  if curr_c >= bb_upper * 0.96:
                      s_tags.append("沿2倍布林上軌強攻")
                  sarah_picks.append({
                      "code": code, "name": name_map[code], "close": round(curr_c, 2),
                      "pct": pct, "vol": curr_v, "ma5": round(ma5, 2), "ma20": round(ma20, 2),
                      "tags": s_tags
                  })

          zhu_lin_picks.sort(key=lambda x: x["pct"], reverse=True)
          sarah_picks.sort(key=lambda x: x["pct"], reverse=True)

          output = {
              "updated_at": f"{market_date} (已全市場掃描 {scanned_count} 檔上市普通股 · 更新 {now_tw.strftime('%H:%M')})",
              "zhu_lin_picks": zhu_lin_picks[:12],
              "sarah_picks": sarah_picks[:12]
          }

          with open("recommendations.json", "w", encoding="utf-8") as f:
              json.dump(output, f, ensure_ascii=False, indent=2)
          print("成功產生 recommendations.json！符合朱林戰法:", len(zhu_lin_picks), "檔")
          EOF
          python run_now.py
      - name: 儲存推薦名單
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add recommendations.json
          git commit -m "Update daily picks" || exit 0
          git push
